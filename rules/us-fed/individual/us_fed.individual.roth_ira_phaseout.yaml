id: us_fed.individual.roth_ira_phaseout
title: Roth IRA contribution phase-out ranges of modified AGI
jurisdiction: US-FED
category: individual
value_type: table
unit: USD
citation: IRC §408A(c)(3)(A), (c)(3)(B)(ii), (c)(3)(D) (indexing)
keys:
- mfj
- single
- mfs
indexed:
  cadence: annual
  expected_by: 11-15
  publication: Annual IRS notice of cost-of-living adjustments for retirement plans and IRAs (Notice 2025-67 for 2026)
  search_hint: Notice amounts relating to retirement plans and IRAs {year} section 408A(c)(3)(B)(ii) maximum Roth IRA contribution phase-out range
bounds:
  min: 0.0
  max: 500000.0
  max_change_pct: 0.1
tags:
- IRA
- Roth
- '408A'
- Form 8606
- inflation
notes: >-
  Each cell is [start, end] of the range of modified AGI (for Roth purposes: AGI without conversion income, plus the IRA
  and student loan deductions and the excluded foreign, savings bond and adoption amounts) over which the maximum Roth
  IRA contribution is reduced (§408A(c)(3)(A)). `mfj` is married filing jointly and a qualifying surviving spouse;
  `single` is single, head of household and married filing separately having lived apart from the spouse all year; `mfs`
  is married filing separately having lived with the spouse (fixed, not indexed). The Maximum Roth IRA Contribution
  Worksheet (Form 8606 instructions) reduces the limit in proportion, rounds up to the next $10 and allows at least $200
  until MAGI reaches the end (§408A(c)(3)(A) applying rules similar to §219(g)(2)(B), (C)).
values:
