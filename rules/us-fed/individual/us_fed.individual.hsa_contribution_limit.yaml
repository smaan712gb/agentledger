- catch_up
indexed:
  cadence: annual
  expected_by: 06-30
  publication: Annual IRS revenue procedure of HSA inflation adjusted amounts (Rev. Proc. 2025-19 for 2026), published by June 1 of the prior year
  search_hint: Revenue Procedure {year} inflation adjusted amounts Health Savings Accounts section 223 annual limitation on deductions
