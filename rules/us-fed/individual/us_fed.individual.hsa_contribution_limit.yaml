notes: >-
  Form 8889 line 3: the limit for an eligible individual with the same HDHP coverage on the first day of every month
  (self_only or family); the Line 3 Limitation Chart and Worksheet prorates it by month otherwise, and the last-month rule
  (§223(b)(8)) treats a person eligible on December 1 as eligible all year. catch_up is the §223(b)(3) additional
  contribution for a person who is 55 or older at the end of the year and not enrolled in Medicare; it is a fixed
  statutory amount, not indexed (Form 8889 line 3 for the unmarried and for married people with self-only coverage all
  year; line 7, prorated by eligible month, for a married person with family coverage at any time). The limit is zero
  for any month the person is enrolled in Medicare (§223(b)(7)).
