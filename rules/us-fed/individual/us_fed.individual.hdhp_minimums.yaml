id: us_fed.individual.hdhp_minimums
title: High deductible health plan definition - minimum annual deductible and maximum out-of-pocket expenses
jurisdiction: US-FED
category: individual
value_type: table
unit: USD
citation: IRC §223(c)(2)(A); §223(g) (indexing)
keys:
- self_only_deductible
- family_deductible
- self_only_out_of_pocket
- family_out_of_pocket
indexed:
  cadence: annual
  expected_by: 06-30
  publication: Annual IRS revenue procedure of HSA inflation adjusted amounts (Rev. Proc. 2025-19 for 2026)
  search_hint: Revenue Procedure {year} high deductible health plan annual deductible not less than out-of-pocket expenses do not exceed
bounds:
  min: 500.0
  max: 50000.0
  max_change_pct: 0.1
tags:
- HSA
- HDHP
- '223'
- Form 8889
- inflation
notes: >-
  Whether a plan is an HDHP is an eligibility fact the preparer states per month (hsa_facts.coverage_MM); the engine
  does not test plan terms. These figures are recorded so the fact can be checked against the plan documents: an HDHP has
  an annual deductible of at least the minimum and out-of-pocket expenses (deductibles, co-payments and other amounts,
  not premiums) of at most the maximum (Form 8889 instructions, "High Deductible Health Plan"). Preventive care,
  telehealth (P.L. 119-21 for plan years after 2024) and insulin safe harbors do not disqualify a plan.
