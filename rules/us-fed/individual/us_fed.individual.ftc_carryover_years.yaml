id: us_fed.individual.ftc_carryover_years
title: Foreign tax credit, carryback and carryover periods for unused foreign tax
jurisdiction: US-FED
category: individual
value_type: table
unit: years
citation: IRC §904(c); Reg. §1.904-2
keys:
- back
- forward
tags:
