  - {id: f1116,      name: "Form 1116 (foreign tax credit)",    jurisdiction: US-FED, years: [2026], status: manual-assisted,
     limits: ["passive category only: general and the other separate categories, and high-taxed passive income (§904(d)(2)(F), line 13), block",
              "foreign-source income, country and category are stated facts from the payer's supplemental statement or Schedule K-3 (no 1099 box carries them)",
              "deductions: the standard deduction, Schedule A lines 4, 5a (general sales taxes), 5b and 5c, and Schedule 1 Part II adjustments are apportioned (lines 3a, 3b); state and local income taxes, other taxes, casualty losses, other itemized deductions and the §68 limitation block; interest expense (lines 4a, 4b) only within the instructions' $5,000 rule; definitely related expenses (line 2), foreign losses (line 5), reductions (line 12) and §960(c) (line 22) are not modelled",
              "qualified dividends only within the adjustment exception (Qualified Dividends and Capital Gain Tax Worksheet line 5 in the 24% bracket, foreign qualified dividends under $20,000); the 0.4054/0.5405 adjustment and the Schedule D Tax Worksheet variant block",
              "a pass-through with ordinary business or rental income blocks (its gross income is not on the return); up to three countries",
              "the carryback of this year's unused tax to the prior year (§904(c)) is a claim on an amended prior-year return and blocks; the prior year's excess limitation is a stated fact (prior_year.ftc_excess_limitation)",
              "AMT credit under the §59(a)(3) simplified limitation election only, with its own stated carryovers (ftc_carryovers[].amt_carryover); when Form 6251 is not required the AMT carryover is recorded only if those facts are stated (warning otherwise)",
              "the 2026 Form 1116 is not posted: line numbers follow the 2025 form, whose figures are statutory and not indexed"],
     evidence: ["tests/test_returns_1116.py (hand-worked from Form 1116 (2025) and its instructions, Form 6251 (2025) instructions line 8, Pub. 514 (2025) Carryback and Carryover Example 1, Rev. Proc. 2025-32 figures)",
