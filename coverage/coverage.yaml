# Published coverage registry (spec §7, ADR-0008). The API, the UI and the return workflow all read this file.
#
# States, lowest to highest:
#   unsupported            the product does not do this; preparation is blocked
#   manual-assisted        the engine assists; a preparer must verify every amount from source
#   planning-only          estimates for planning; never used on a return
#   preparation-validated  independent fixtures pass and the tax-content owner signed off; can be prepared
#   export-validated       the export imports correctly into the named target software (verified)
#   filing-approved        the agency approved this form (e.g. IRS ATS) for this tax year; can be transmitted
#   suspended              withdrawn pending a fix; behaves like unsupported
#
# A status may only move up with evidence recorded here. Code checking its own output is not evidence.

owner: null            # named tax-content owner; required before anything is preparation-validated
reviewed_at: null

