id: general
title: General business
description: Baseline chart of accounts and postings every client inherits.
extends: null
accounts:
  - {code: "1000", name: Operating Cash, type: asset}
  - {code: "1100", name: Accounts Receivable, type: asset}
  - {code: "1200", name: Inventory, type: asset}
  - {code: "1500", name: Equipment, type: asset}
  - {code: "1550", name: Accumulated Depreciation, type: asset}
  - {code: "1900", name: Municipal Bonds, type: asset}
  - {code: "2000", name: Accounts Payable, type: liability}
  - {code: "2100", name: Credit Card Payable, type: liability}
  - {code: "2200", name: Sales Tax Payable, type: liability}
  - {code: "2300", name: Payroll Liabilities, type: liability}
  - {code: "3000", name: Owner Equity, type: equity}
  - {code: "3100", name: Retained Earnings, type: equity}
  - {code: "4000", name: Sales and Service Revenue, type: revenue}
  - {code: "4900", name: Interest Income, type: revenue}
  - {code: "4910", name: Tax-Exempt Interest Income, type: revenue}
  - {code: "5000", name: Cost of Goods Sold, type: expense}
  - {code: "6000", name: Wages, type: expense}
  - {code: "6100", name: Rent, type: expense}
  - {code: "6200", name: Meals, type: expense}
  - {code: "6210", name: Entertainment, type: expense}
  - {code: "6300", name: Travel, type: expense}
  - {code: "6400", name: Vehicle, type: expense}
  - {code: "6500", name: Depreciation Expense, type: expense}
  - {code: "6600", name: Insurance, type: expense}
  - {code: "6610", name: Officer Life Insurance, type: expense}
  - {code: "6700", name: Penalties and Fines, type: expense}
  - {code: "6800", name: Office and Software, type: expense}
  - {code: "6900", name: Professional Fees, type: expense}
  - {code: "7000", name: Federal Income Tax Expense, type: expense}
templates:
  - id: cash_sale
    title: Cash or card sale
    memo: "Sale: {description}"
    inputs: [{name: description, type: text}, {name: amount}, {name: sales_tax}]
    lines:
      - {account: "1000", amount: "amount + sales_tax"}
      - {account: "4000", amount: "-amount"}
      - {account: "2200", amount: "-sales_tax"}
    sample: {description: counter sale, amount: 100, sales_tax: 8.25}
  - id: expense_paid
    title: Expense paid from operating cash
    memo: "{vendor}: {description}"
    inputs: [{name: vendor, type: text}, {name: description, type: text}, {name: expense_account, type: account}, {name: amount}]
    lines:
      - {account: "$expense_account", amount: "amount"}
      - {account: "1000", amount: "-amount"}
    sample: {vendor: Staples, description: printer paper, expense_account: "6800", amount: 42.10}
  - id: business_meal
    title: Business meal (50% limited)
    memo: "Meal with {attendees}: {purpose}"
    inputs: [{name: attendees, type: text}, {name: purpose, type: text}, {name: amount}]
    lines:
      - {account: "6200", amount: "amount", tax_treatment: meals}
      - {account: "2100", amount: "-amount"}
    sample: {attendees: client CFO, purpose: renewal discussion, amount: 186.40}
  - id: book_depreciation
    title: Monthly book depreciation
    memo: "Depreciation {period}"
    inputs: [{name: period, type: text}, {name: amount}]
    lines:
      - {account: "6500", amount: "amount", tax_treatment: depreciation}
      - {account: "1550", amount: "-amount"}
    sample: {period: 2026-06, amount: 1250}
doc_types: [Invoice, Receipt, Bank statement, 1099-NEC, 1099-K]
facts: [state, employees, owner_has_home, contractor_payments, has_retirement_plan]
checks:
  - id: cash_overdraft
    title: Operating cash is negative on the books
    type: min_balance
    params: {account: "1000", min: 0}
    severity: medium
    owner: cpa
    detail: A negative book cash balance usually means unrecorded deposits, duplicated payments or a missing bank feed.
kpis:
  - {id: gross_margin, title: Gross margin, expr: "(bal_4000 - bal_5000) / bal_4000 * 100", unit: "%"}
  - {id: revenue, title: Revenue, expr: "bal_4000", unit: USD}
