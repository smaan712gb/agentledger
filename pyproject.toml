[project]
name = "veritas"
version = "0.1.0"
description = "Open-source accounting, ledger and tax platform where AI agents do the work and deterministic code proves every number"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "cryptography>=43",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Independent cross-check of computed returns (AgentLedger never depends on it to compute).
oracle = ["policyengine-us>=1.400"]

[project.scripts]
veritas = "veritas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
