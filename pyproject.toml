[project]
name = "agentledger"
version = "0.1.0"
description = "Open-source accounting, ledger and tax platform where AI agents do the work and deterministic code proves every number"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.15.4",           # 0.12 breaks with click >= 8.5 (secondary flags)
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",   # PostgreSQL (Neon) financial authority, ADR-0002
    "boto3>=1.36",            # S3-compatible evidence storage (Cloudflare R2; MinIO locally), F-06; 1.36: checksum settings
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
# Independent cross-check of computed returns (AgentLedger never depends on it to compute).
oracle = ["policyengine-us>=1.400"]

[project.scripts]
agentledger = "agentledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Errors that are bugs, not style: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
# The typed core, enforced in CI: money, tenancy, identity, filing, audit and the external-model gate.
# Agent, intake and research modules join as they are made type-clean (backlog F-03).
files = [
    "src/agentledger/db.py", "src/agentledger/audit.py", "src/agentledger/pg", "src/agentledger/ledger",
    "src/agentledger/crm", "src/agentledger/returns/store.py", "src/agentledger/returns/filing.py", "src/agentledger/returns/individual.py",
    "src/agentledger/returns/model.py", "src/agentledger/returns/documents.py", "src/agentledger/returns/sheet.py",
    "src/agentledger/returns/tax.py", "src/agentledger/returns/facts.py", "src/agentledger/workflow",
    "src/agentledger/security", "src/agentledger/integrity", "src/agentledger/coverage.py", "src/agentledger/release.py",
    "src/agentledger/api", "src/agentledger/ai/router.py", "src/agentledger/ai/grounding.py", "src/agentledger/expr.py",
    "src/agentledger/calc", "src/agentledger/kb", "src/agentledger/foundry/verify.py", "src/agentledger/envfile.py",
    "src/agentledger/app_context.py", "src/agentledger/evidence",
]
