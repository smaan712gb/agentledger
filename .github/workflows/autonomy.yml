# The always-on AgentLedger workforce.
# Every 6 hours: run every due agent, run the full test + golden suites, and open a pull
# request with whatever the agents changed (rules, playbooks, models, proposals, research).
# Auto-adopted routine changes arrive already verified; everything else is a pending
# proposal for a CPA to decide in the app. Humans review outcomes, not code.
name: autonomy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGENTLEDGER_HOME: ${{ github.workspace }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: frontier tier, budget-capped in config/models.yaml
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}             # repo scout rate limits
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }} # enacted state tax laws (all states)
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}     # enacted federal laws (GovInfo)
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}  # Workers AI model inventory
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/agentledger
      AGENTLEDGER_REQUIRE_PG: "1"   # fail, never skip, the database tests in CI
    services:
      postgres:                     # the ledger core's database tests (tests/test_pg_ledger.py) run against this
        image: postgres:17
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: agentledger}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,oracle]"
      - name: Local open-source models (Ollama)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          python - <<'EOF'
          import yaml, subprocess
          roles = yaml.safe_load(open("config/models.yaml"))["roles"]
          for m in {r["model"] for r in roles.values() if r["tier"] == "local"}:
              subprocess.run(["ollama", "pull", m], check=False)
          EOF
      - name: Run due agents
        run: agentledger agents due
      - name: Tests and golden regression must stay green
        run: |
          python -m pytest -q          # includes the PolicyEngine cross-checks
          agentledger golden
      - name: Open a pull request with the workforce's changes
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: agentledger/autonomy
          commit-message: "AgentLedger agents: scheduled run"
          title: "AgentLedger agents: regulation, model and knowledge updates"
          body: |
            Automated run of the AgentLedger agent workforce.

            - `rules/CHANGELOG.md` lists every rule value adopted, with its source and evidence.
            - `state/proposals/` holds pending proposals awaiting a CPA decision in the app.
            - `research/` holds new research briefs.

            All tests and golden regression scenarios passed in this run.
          add-paths: |
            rules/**
            playbooks/**
            golden/**
            config/models.yaml
            config/oss_inventory.yaml
            state/proposals/**
            state/regwatch_seen.json
            state/agent_runs.jsonl
            research/**
            state/state_watch.json
            state/irs_forms_seen.json
            state/coverage_flags.json
            state/model_inventory.json
      - name: Release decision (config/release_policy.yaml)
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          set +e
          agentledger release classify --base origin/main > decision.json
          code=$?
          set -e
          pr=${{ steps.cpr.outputs.pull-request-number }}
          if [ "$code" = "0" ]; then
            gh pr edit "$pr" --add-label auto-release
            gh pr merge "$pr" --auto --squash     # merges once required checks pass, then release.yml deploys
          else
            gh pr edit "$pr" --add-label needs-approval
            python scripts/release_comment.py decision.json > comment.md
            gh pr comment "$pr" --body-file comment.md
          fi
