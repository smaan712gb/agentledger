# The always-on workforce for teams that run Veritas from a repository.
# Every 6 hours: run every due agent, run the full test + golden suites, and open a pull
# request with whatever the agents changed (rules, playbooks, models, proposals, research).
# Auto-adopted routine changes arrive already verified; everything else is a pending
# proposal for a CPA to decide in the app. Humans review outcomes, not code.
name: autonomy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERITAS_HOME: ${{ github.workspace }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: frontier tier, budget-capped in config/models.yaml
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}             # repo scout rate limits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Local open-source models (Ollama)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          python - <<'EOF'
          import yaml, subprocess
          roles = yaml.safe_load(open("config/models.yaml"))["roles"]
          for m in {r["model"] for r in roles.values() if r["tier"] == "local"}:
              subprocess.run(["ollama", "pull", m], check=False)
          EOF
      - name: Run due agents
        run: veritas agents due
      - name: Tests and golden regression must stay green
        run: |
          python -m pytest -q
          veritas golden
      - name: Open a pull request with the workforce's changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: veritas/autonomy
          commit-message: "Veritas agents: scheduled run"
          title: "Veritas agents: regulation, model and knowledge updates"
          body: |
            Automated run of the Veritas agent workforce.

            - `rules/CHANGELOG.md` lists every rule value adopted, with its source and evidence.
            - `state/proposals/` holds pending proposals awaiting a CPA decision in the app.
            - `research/` holds new research briefs.

            All tests and golden regression scenarios passed in this run.
          add-paths: |
            rules/**
            playbooks/**
            golden/**
            config/models.yaml
            config/oss_inventory.yaml
            state/proposals/**
            state/regwatch_seen.json
            state/agent_runs.jsonl
            research/**
