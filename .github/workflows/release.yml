# Continuous delivery: every merge to main is tested, deployed to staging, smoke-tested, then rolled out to
# production (config/release_policy.yaml -> deployment). The runbook is docs/DEPLOY.md.
#
# The deploy jobs run only when the repository variable DEPLOY_ENABLED is "true": the owner sets it after creating
# the Cloudflare project, its secrets and the GitHub environments (docs/DEPLOY.md). Until then, wrangler.jsonc being
# present changes nothing and main stays green.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: {group: release, cancel-in-progress: false}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deployable: ${{ steps.deployable.outputs.deployable }}
    services:
      postgres:                     # the ledger core's database tests (tests/test_pg_ledger.py) run against this
        image: postgres:17
        env: {POSTGRES_PASSWORD: ci, POSTGRES_DB: agentledger}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/agentledger
      AGENTLEDGER_REQUIRE_PG: "1"   # fail, never skip, the database tests in CI
      AGENTLEDGER_TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,oracle]"
      - name: Lint (bugs, not style)
        run: ruff check src tests scripts
      - name: Types (the typed core in pyproject.toml)
        run: mypy
      - name: S3-compatible store for the evidence tests (R2 in production)
        run: docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs server -s3 -dir=/data && sleep 8
      - name: Full suite, golden regression and independent cross-checks
        run: |
          python -m pytest -q
          AGENTLEDGER_HOME=$PWD agentledger golden
      - name: The whole suite again with every firm store on PostgreSQL
        run: AGENTLEDGER_DATABASE=postgres python -m pytest -q
      - name: Is there a Cloudflare project to deploy?
        id: deployable
        run: echo "deployable=$([ -f wrangler.jsonc ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  minimum-versions:
    # The lowest versions pyproject.toml allows must work too (re-audit of fe75514: boto3 1.34 was allowed and crashed).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install uv && uv pip install --system --resolution lowest-direct -e ".[dev]"
      - name: The suite at the lowest allowed versions
        run: python -m pytest -q

  staging:
    needs: [verify, minimum-versions]
    if: needs.verify.outputs.deployable == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: {name: staging, url: "${{ vars.STAGING_URL }}"}
    env:
      AGENTLEDGER_HOME: ${{ github.workspace }}
      AGENTLEDGER_DATABASE: postgres
      AGENTLEDGER_PG_TENANCY: ${{ vars.AGENTLEDGER_PG_TENANCY || 'schema' }}   # must match wrangler.jsonc env.staging.vars
      AGENTLEDGER_IDENTITY: workos
      AGENTLEDGER_AGENTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install . httpx
      - name: Stamp the build (GET /healthz reports it; the smoke test waits for it)
        run: echo "$GITHUB_SHA" > BUILD_SHA
      - name: Migrate the platform and firm stores (owner credentials; migrations roll forward only)
        env:
          AGENTLEDGER_MIGRATION_URL: ${{ secrets.AGENTLEDGER_MIGRATION_URL }}
          AGENTLEDGER_RUNTIME_DATABASE_URL: ${{ secrets.AGENTLEDGER_RUNTIME_DATABASE_URL }}
          AGENTLEDGER_DB_ROLE_KEY: ${{ secrets.AGENTLEDGER_DB_ROLE_KEY }}
        run: agentledger platform migrate
      - name: Provision the stores of firms created since the last release
        env:
          AGENTLEDGER_MIGRATION_URL: ${{ secrets.AGENTLEDGER_MIGRATION_URL }}
          AGENTLEDGER_RUNTIME_DATABASE_URL: ${{ secrets.AGENTLEDGER_RUNTIME_DATABASE_URL }}
          AGENTLEDGER_DB_ROLE_KEY: ${{ secrets.AGENTLEDGER_DB_ROLE_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
        run: agentledger platform provision
      - name: Deploy the Worker and the API image to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --env staging
      - name: Smoke tests (health reaches this build, sign-in surface, coverage, a golden return through the API)
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          SMOKE_TOKEN: ${{ secrets.STAGING_SMOKE_TOKEN }}
        run: python scripts/smoke.py "${{ vars.STAGING_URL }}"

  production:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Required reviewers on this GitHub environment are the production approval gate (docs/DEPLOY.md).
    environment: {name: production, url: "${{ vars.PROD_URL }}"}
    permissions:
      contents: read
      actions: write          # gh variable set PROD_LAST_GOOD_SHA
    env:
      AGENTLEDGER_HOME: ${{ github.workspace }}
      AGENTLEDGER_DATABASE: postgres
      AGENTLEDGER_PG_TENANCY: ${{ vars.AGENTLEDGER_PG_TENANCY || 'database' }}   # must match wrangler.jsonc env.production.vars
      AGENTLEDGER_IDENTITY: workos
      AGENTLEDGER_AGENTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install . httpx
      - name: Stamp the build
        run: echo "$GITHUB_SHA" > BUILD_SHA
      - name: Migrate the platform and firm stores (owner credentials; migrations roll forward only)
        env:
          AGENTLEDGER_MIGRATION_URL: ${{ secrets.AGENTLEDGER_MIGRATION_URL }}
          AGENTLEDGER_RUNTIME_DATABASE_URL: ${{ secrets.AGENTLEDGER_RUNTIME_DATABASE_URL }}
          AGENTLEDGER_DB_ROLE_KEY: ${{ secrets.AGENTLEDGER_DB_ROLE_KEY }}
        run: agentledger platform migrate
      - name: Provision the stores of firms created since the last release
        env:
          AGENTLEDGER_MIGRATION_URL: ${{ secrets.AGENTLEDGER_MIGRATION_URL }}
          AGENTLEDGER_RUNTIME_DATABASE_URL: ${{ secrets.AGENTLEDGER_RUNTIME_DATABASE_URL }}
          AGENTLEDGER_DB_ROLE_KEY: ${{ secrets.AGENTLEDGER_DB_ROLE_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
        run: agentledger platform provision
      - name: Deploy the Worker and the API image to production
        # `wrangler deploy` (not `versions upload`/`versions deploy`, which do not roll out container images) activates
        # the Worker, then rolls the image out in the steps configured in wrangler.jsonc.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --env production
      - name: Soak for 15 minutes (the smoke checks every 5 minutes; the first waits for the rollout to reach this build)
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          SMOKE_TOKEN: ${{ secrets.PROD_SMOKE_TOKEN }}
          PROD_URL: ${{ vars.PROD_URL }}
          LAST_GOOD: ${{ vars.PROD_LAST_GOOD_SHA }}
        run: |
          for i in 1 2 3 4; do
            if ! python scripts/smoke.py "$PROD_URL"; then
              echo "::error::production smoke check $i of 4 failed for ${GITHUB_SHA}; roll back (docs/DEPLOY.md, Rollback)"
              echo "Worker code:  npx wrangler rollback --env production            (pick the previous deployment)"
              echo "API image:    redeploy the last good commit, ${LAST_GOOD:-unknown}:"
              echo "              git checkout ${LAST_GOOD:-<sha>} && echo ${LAST_GOOD:-<sha>} > BUILD_SHA && npx wrangler deploy --env production"
              echo "              (or push a branch at that commit and run this workflow for it; migrations never roll back)"
              exit 1
            fi
            [ "$i" -lt 4 ] && sleep 300
          done
      - name: Record the last good production build
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh variable set PROD_LAST_GOOD_SHA --body "$GITHUB_SHA"
