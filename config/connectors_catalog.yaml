# Integration catalog. "available" ships today. "buildable" means the AI Engineer can build it on
# request from the vendor's public API docs: the request becomes a work item, the Engineer writes the
# plugin (manifest + code + tests) in an isolated worktree, and a human approves it (supply chain).
# Every connector, however built, only emits transactions / documents / template postings into the
# normal pipelines and only gets the permissions its manifest declares.
connectors:
