# Capital Loss Carryover Worksheet (Schedule D instructions, lines 1-13), worked by hand: a 10,000 long-term carryover
# from 2025 and no other capital items; 3,000 is deducted (line 21), taxable income 40,900 stays positive, so line 4 =
# 3,000, line 5 = 0 (line 7 is not a loss), line 9 = 10,000, line 11 = 3,000, line 13 = 7,000 carries to 2027.
- id: f1040-2026-capital-loss-carryover
  calc: form_1040_line
  inputs:
    form: ws_capital_loss_carryover
    line: "13"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 60000}], prior_year: {capital_loss_carryover_long: 10000}}
  expect: 7000
  source: Schedule D instructions, Capital Loss Carryover Worksheet lines 1-13; IRC §1211(b), §1212(b)
# Form 8880 worked by hand: 3,000 of 401(k) deferrals (W-2 box 12 code D), no distributions in the testing period,
# line 6 = 2,000, AGI 30,000 is in the 10% band for a single filer (Notice 2025-67: over 26,250, not over 40,250),
# line 10 = 200; tax 1,423 on taxable income 13,900 leaves the whole 200.
- id: f1040-2026-savers-credit
  calc: form_1040_line
  inputs:
    form: f8880
    line: "12"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01", full_time_student: false},
             w2s: [{wages: 30000, box12: {D: 3000}}], retirement_savings: [{owner: taxpayer, testing_period_distributions: 0}]}
  expect: 200
  source: Notice 2025-67 pages 3-4 (§25B(b)(1) limits for 2026); Form 8880 (2025) lines 1-12; IRC §25B
# Form 8889 worked by hand (Form 8889 (2025) lines 2-13; Rev. Proc. 2025-19 §2.01(1) 2026 limits): self-only HDHP coverage on
# the first day of every month, Form 5498-SA box 2 = 4,400 of which 2,000 are employer contributions (W-2 box 12 code W):
# line 2 = 2,400, line 3 = 4,400, line 9 = 2,000, line 12 = 2,400, line 13 = 2,400 to Schedule 1 line 13.
- id: f1040-2026-hsa-deduction
  calc: form_1040_line
  inputs:
    form: "f8889[taxpayer]"
    line: "13"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 60000, box12: {W: 2000}}], hsa_contributions: [{total_contributions: 4400}],
             hsa_facts: [{coverage_01: self_only, coverage_02: self_only, coverage_03: self_only, coverage_04: self_only,
                          coverage_05: self_only, coverage_06: self_only, coverage_07: self_only, coverage_08: self_only,
                          coverage_09: self_only, coverage_10: self_only, coverage_11: self_only, coverage_12: self_only}]}
  expect: 2400
  source: Rev. Proc. 2025-19 §2.01(1) ($4,400 self-only for 2026); Form 8889 (2025) lines 2-13 and instructions, line 3 rule 3; IRC §223(b)
# Form 8606 worked by hand from Pub. 590-B (2025) Worksheet 1-1 illustrated (Rose Green) with 2026 figures: basis 300, a 2,000
# contribution while covered (wages 84,460 put modified AGI at 89,000, inside the 2026 single range 81,000-91,000: 1,500
# deductible, 500 nondeductible), 5,000 distributed and converted to a Roth IRA, IRAs worth 20,000: ratio 2,300 / 25,000 =
# 0.092, nontaxable 460 (lines 13 and 17), taxable conversion 4,540 on line 18 (and Form 1040 line 4b), basis carried 340.
- id: f1040-2026-nondeductible-ira
  calc: form_1040_line
  inputs:
    form: "f8606[taxpayer]"
    line: "18"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 84460, retirement_plan: true}],
             ira_accounts: [{ira_contributions: 2000, fmv: 20000, account_type: ira}, {roth_conversion: 5000, fmv: 5000, account_type: roth}],
             retirement: [{gross_distribution: 5000, ira_sep_simple: true, distribution_code: "2"}],
             prior_year: {traditional_ira_basis: 300}, ira_facts: [{contributions_after_year_end: 0}]}
  expect: 4540
  source: Pub. 590-B (2025) Worksheet 1-1 illustrated; Form 8606 (2025) lines 8, 13, 16-18; Notice 2025-67 page 4 (2026 phase-out 81,000-91,000); IRC §408(d)(2), §408A(d)(3)
# Form 1116 worked by hand (Form 1116 (2025) instructions, Parts I and III): wages 60,000 and a foreign bank's 10,000 of
# interest, all foreign source, with 1,500 of foreign tax (passive). Line 1a 10,000; 3a 16,100 (standard deduction);
# 3f = 10,000 / 70,000 = 0.1429; 3g = 2,301; 7 = 17 = 7,699; 18 = 53,900; 19 = 0.1428; 20 = 6,576 (Tax Table); 21 = 939;
# 24 = smaller of 1,500 and 939 = 939, to Schedule 3 line 1; 561 carries to 2027 (2025 had no excess limitation).
- id: f1040-2026-foreign-tax-credit
  calc: form_1040_line
  inputs:
    form: "f1116[passive]"
    line: "24"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 60000}],
             interest: [{payer: Hanse Bank, interest: 10000, foreign_tax_paid: 1500, foreign_source_income: 10000, foreign_country: Germany}],
             prior_year: {ftc_excess_limitation: {passive: 0}}}
  expect: 939
  source: Form 1116 (2025) instructions, Part I lines 3a-3g and Part III lines 17-24; IRC §904(a), (c); Rev. Proc. 2025-32 §4.01, §4.14
# Form 4797 worked by hand (Form 4797 (2025) Part III lines 20-25b and 30-32, Part I lines 6-7, Part II lines 13-18b; Pub. 544
# (2025) chapter 3, Section 1245 Property, Gain Treated as Ordinary Income): a machine bought in 2022 for 20,000 with 12,000 of
# depreciation allowed is sold in 2026 for 24,000: adjusted basis 8,000, total gain 16,000; the smaller of the gain and the
# depreciation, 12,000, is ordinary income under IRC §1245(a)(1) (line 25b, line 31, line 13, line 18b to Schedule 1 line 4); the
# 4,000 remainder (line 32, line 6, line 7) is section 1231 gain, long-term capital gain on Schedule D line 11 because the
# prior-year group states no nonrecaptured section 1231 losses (IRC §1231(a), (c)).
- id: f1040-2026-section-1245-recapture
  calc: form_1040_line
  inputs:
    form: f4797
    line: "18b"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 60000}], prior_year: {},
             dispositions: [{description: Machine, acquired: "2022-03-01", sold: "2026-06-01", gross_sales_price: 24000, cost_or_basis: 20000,
                             depreciation_allowed: 12000, property_class: section_1245}]}
  expect: 12000
  source: Form 4797 (2025) lines 20-25b, 30-32, 6-7 and 13-18b and its instructions; Pub. 544 (2025) chapter 3, Section 1245 Property; IRC §1245(a)(1), §1231(a), (c)
# Form 8615 worked by hand (Form 8615 (2026 draft, May 7, 2026) lines 1-18 and its draft instructions (June 11, 2026); Rev. Proc. 2025-32
# §4.02 and §4.14(2) for the 1,350 / 2,700 amounts): a 12-year-old claimable as a dependent with 8,000 of interest and no earned
# income: AGI 8,000, taxable income 6,650; line 1 = 8,000, 2 = 2,700, 3 = 5 = 5,300. The custodial parent files single with taxable
# income 60,000 and tax 7,918: line 8 = 65,300, 9 = tax at the parent's rates (Tax Table midpoint 65,325: 5,800 + 22% x 14,925 =
# 9,083.50) = 9,084, 11 = 13 = 1,166; line 14 = 1,350 at the child's rate (midpoint 1,362.50 x 10%) = 136; 16 = 1,302 against 17 =
# 668 (the tax on 6,650): line 18 = 1,302 to Form 1040 line 16.
- id: f1040-2026-kiddie-tax
  calc: form_1040_line
  inputs:
    form: f8615
    line: "18"
    return: {tax_year: 2026, filing_status: single,
             taxpayer: {ssn: "400-00-0100", dob: "2014-03-15", can_be_claimed_as_dependent: true, has_living_parent: true},
             interest: [{payer: Trust Bank, interest: 8000}],
             form_8615: {which_parent: custodial_parent,
                         parent: {name: Alex Rivera, ssn: "400-00-0001", filing_status: single, taxable_income: 60000, tax: 7918}}}
  expect: 1302
  source: Form 8615 (2026 draft) lines 1-18 and its instructions (Who Must File, lines 1-18); IRC §1(g); Rev. Proc. 2025-32 §4.01, §4.02, §4.14(2)
