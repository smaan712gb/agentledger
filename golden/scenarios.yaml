# Golden regression scenarios: deterministic answers every rule change is checked
# against. The Researcher agent proposes new ones from fresh guidance; a scenario is
# only added once the engine reproduces the value stated by the authority.
- id: std-deduction-single-2024
  calc: standard_deduction
  inputs: {tax_year: 2024, filing_status: single}
  expect: 14600
  source: Rev. Proc. 2023-34
- id: std-deduction-mfj-2025
  calc: standard_deduction
  inputs: {tax_year: 2025, filing_status: mfj}
  expect: 31500
  source: P.L. 119-21 §70102
- id: std-deduction-hoh-2026
  calc: standard_deduction
  inputs: {tax_year: 2026, filing_status: hoh}
  expect: 24150
  source: Rev. Proc. 2025-32
- id: meals-2026
  calc: meals_deduction
  inputs: {amount: 1000, date: "2026-03-01"}
  expect: 500.00
- id: mileage-2026
  calc: mileage_deduction
  inputs: {miles: 1000, tax_year: 2026}
  expect: 725.00
  source: Notice 2026-10
- id: sec179-phaseout-2026
  calc: section_179
  inputs: {tax_year: 2026, elected: 3000000, total_placed_in_service: 4500000}
  expect: 2150000
  source: Rev. Proc. 2025-32 §4.24
- id: bonus-pre-obbba-acquisition
  calc: bonus_rate
  inputs: {acquired: "2024-12-01", placed_in_service: "2025-02-01"}
  expect: 0.4
- id: bonus-post-obbba-acquisition
  calc: bonus_rate
  inputs: {acquired: "2025-03-01", placed_in_service: "2025-03-15"}
  expect: 1.0
- id: nec-required-2025
  calc: form_1099_nec_required
  inputs: {total_paid: 1500, calendar_year: 2025}
  expect: true
- id: nec-not-required-2026
  calc: form_1099_nec_required
  inputs: {total_paid: 1500, calendar_year: 2026}
  expect: false
- id: boi-domestic-2024
  calc: boi_report_required
  inputs: {formed_under: domestic, date: "2024-06-01"}
  expect: true
- id: boi-domestic-2026
  calc: boi_report_required
  inputs: {formed_under: domestic, date: "2026-09-01"}
  expect: false
- id: boi-foreign-2026
  calc: boi_report_required
  inputs: {formed_under: foreign, date: "2026-09-01"}
  expect: true
- id: diesel-excise-2026
  calc: fuel_excise
  inputs: {gallons: 1000, fuel: diesel, date: "2026-06-01"}
  expect: 244.00
- id: salt-cap-2030-reversion
  calc: salt_cap
  inputs: {tax_year: 2030}
  expect: 10000
- id: corp-tax-2026
  calc: corporate_tax
  inputs: {taxable_income: 100000, tax_year: 2026}
  expect: 21000
# Whole-return scenarios (TY2026). Expected values worked by hand from Rev. Proc. 2025-32,
# P.L. 119-21 and the 2026 draft forms; see tests/test_returns_1040.py.
- id: f1040-2026-single-wages-tax
  calc: form_1040_line
  inputs:
    form: f1040
    line: "16"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 60000, federal_withholding: 6000}]}
  expect: 5023
  source: Rev. Proc. 2025-32 §4.01, §4.14
- id: f1040-2026-hoh-eic
  calc: form_1040_line
  inputs:
    form: f1040
    line: "27a"
    return: {tax_year: 2026, filing_status: hoh, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             dependents: [{first_name: Ana, ssn: "400-00-0100", dob: "2022-01-15", relationship: daughter}],
             w2s: [{wages: 25000, ss_wages: 25000, medicare_wages: 25000}]}
  expect: 4246
  source: Rev. Proc. 2025-32 §4.06; IRC §32(b)
- id: f1040-2026-self-employed-qbi
  calc: form_1040_line
  inputs:
    form: f8995
    line: "15"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             businesses: [{name: Design, gross_receipts: 100000, expenses: {supplies: 20000}}]}
  expect: 11650
  source: IRC §199A; IRC §1401-1402
- id: f1040-2026-senior-deduction
  calc: form_1040_line
  inputs:
    form: sch_1a
    line: "43"
    return: {tax_year: 2026, filing_status: mfj, taxpayer: {ssn: "400-00-0003", dob: "1960-05-01"},
             spouse: {ssn: "400-00-0004", dob: "1959-08-01"},
             social_security: [{net_benefits: 40000}], retirement: [{gross_distribution: 50000, taxable_amount: 50000}]}
  expect: 12000
  source: P.L. 119-21 §70103
- id: f1040-2026-amt-iso
  calc: form_1040_line
  inputs:
    form: sch_2
    line: "2"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 200000}], amt_adjustments: {iso: 300000}}
  expect: 73148
  source: Rev. Proc. 2025-32 §4.10; IRC §55
# Capital Loss Carryover Worksheet (Schedule D instructions, lines 1-13), worked by hand: a 10,000 long-term carryover
# from 2025 and no other capital items; 3,000 is deducted (line 21), taxable income 40,900 stays positive, so line 4 =
# 3,000, line 5 = 0 (line 7 is not a loss), line 9 = 10,000, line 11 = 3,000, line 13 = 7,000 carries to 2027.
- id: f1040-2026-capital-loss-carryover
  calc: form_1040_line
  inputs:
    form: ws_capital_loss_carryover
    line: "13"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01"},
             w2s: [{wages: 60000}], prior_year: {capital_loss_carryover_long: 10000}}
  expect: 7000
  source: Schedule D instructions, Capital Loss Carryover Worksheet lines 1-13; IRC §1211(b), §1212(b)
# Form 8880 worked by hand: 3,000 of 401(k) deferrals (W-2 box 12 code D), no distributions in the testing period,
# line 6 = 2,000, AGI 30,000 is in the 10% band for a single filer (Notice 2025-67: over 26,250, not over 40,250),
# line 10 = 200; tax 1,423 on taxable income 13,900 leaves the whole 200.
- id: f1040-2026-savers-credit
  calc: form_1040_line
  inputs:
    form: f8880
    line: "12"
    return: {tax_year: 2026, filing_status: single, taxpayer: {ssn: "400-00-0001", dob: "1985-06-01", full_time_student: false},
             w2s: [{wages: 30000, box12: {D: 3000}}], retirement_savings: [{owner: taxpayer, testing_period_distributions: 0}]}
  expect: 200
  source: Notice 2025-67 pages 3-4 (§25B(b)(1) limits for 2026); Form 8880 (2025) lines 1-12; IRC §25B
